<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کافه‌نت: امپراتوری</title>
<style>
  html, body { margin: 0; height: 100%; background: #060709; color: #57ff9e;
    font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="s">☕ کافه‌نت…</div>
<script>
/* بوتِ APK: اگر آپدیتِ خودکارِ دانلودشده‌ای هست، همان اجرا می‌شود؛ وگرنه نسخه‌ی داخلی */
try {
  var B = localStorage.getItem('cafnet_bundle');
  if (B && B.length > 100000 && B.indexOf('</html>') > 0) {
    /* نگهبان: اگر نسخهٔ دانلودشده تا ۴.۵ ثانیه زنده نشد → پاکسازی و برگشت به نسخهٔ داخلی */
    setTimeout(function() {
      try {
        if (!(window.__BOOT_READY || window.__BOOT_ALIVE)) {
          var _sp = document.getElementById('s'); if (_sp) _sp.textContent = '☕ بازآوریِ نسخه…';
          localStorage.removeItem('cafnet_bundle');
          localStorage.removeItem('cafnet_bundle_ver');
          location.replace('cafnet.html');
        }
      } catch (e) {}
    }, 4500);
    document.open(); document.write(B); document.close();
  } else { location.replace('cafnet.html'); }
} catch (e) { try { location.replace('cafnet.html'); } catch (e2) {} }
</script>
</body>
</html>
